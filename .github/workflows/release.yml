name: Release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build-manager:
    uses: ./.github/workflows/build-manager.yml
    secrets: inherit
  release:
    needs:
      - build-manager
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Manager artifacts
        uses: actions/download-artifact@v8
        with:
          path: manager
          name: "Manager-release"
          merge-multiple: true

      - name: Check is rc tags
        id: is_rc_tag
        run: |
          if [ "${{ contains(github.ref_name,'-rc') }}" == 'true' ]; then
            echo "IS_RC_TAG=true" >> $GITHUB_OUTPUT
          else
            echo "IS_RC_TAG=false" >> $GITHUB_OUTPUT
          fi

      - name: release
        uses: softprops/action-gh-release@v3
        with:
          prerelease: ${{ steps.is_rc_tag.outputs.IS_RC_TAG == 'true' }}
          files: |
            manager/*.apk

  notify:
    needs:
      - release
    if: success()
    runs-on: ubuntu-latest
    steps:
      - name: Notify Telegram channel
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ vars.CHAT_ID || '@Huijui123' }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$BOT_TOKEN" ] || [ -z "$CHAT_ID" ]; then
            echo "::warning::BOT_TOKEN / CHAT_ID 未配置，跳过 TG 通知"
            exit 0
          fi

          NOTES=$(printf '• 壁纸不再拉伸（等比 cover）\n• 视频层改 TextureView，修复点击穿透 / 闪黑块\n• 深色与壁纸下文字转白\n• Dock 支持左右拖动，指示器液态玻璃\n• 超级用户默认只列用户应用\n• 修补 boot 加超时与产物校验')
          TEXT=$(printf '🚀 <b>HuiJuiSU NEXT %s</b>\n\n%s\n\n⬇️ %s\n💬 https://t.me/Huijui123' \
            "$TAG" "$NOTES" "https://github.com/${REPO}/releases/tag/${TAG}")

          curl -sS -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            --data-urlencode "text=${TEXT}" \
            -d "parse_mode=HTML" \
            -d "disable_web_page_preview=false" | head -c 300
