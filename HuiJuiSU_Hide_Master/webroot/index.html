<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HuiJuiSU Ultimate Shield</title>
    <style>
        :root { --neon-blue: #00f0ff; --neon-purple: #9d4edf; --neon-red: #ff003c; --neon-green: #00ff66; --bg-dark: #050508; --glass-bg: rgba(20, 25, 35, 0.4); --glass-border: rgba(0, 240, 255, 0.15); --text-main: #e2e8f0; --text-sub: #64748b; }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background-color: var(--bg-dark); color: var(--text-main); min-height: 100vh; overflow-x: hidden; background-image: radial-gradient(circle at 10% 10%, rgba(0,240,255,0.15), transparent 40%), radial-gradient(circle at 90% 90%, rgba(157,78,223,0.15), transparent 40%), linear-gradient(rgba(0,240,255,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(0,240,255,0.03) 1px, transparent 1px); background-size: 100% 100%, 100% 100%, 30px 30px, 30px 30px; background-attachment: fixed; }
        .app-container { padding: 24px 16px 40px; max-width: 600px; margin: 0 auto; animation: fadeIn 0.6s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        .header { text-align: center; margin-bottom: 30px; position: relative; }
        .logo-wrapper { width: 90px; height: 90px; margin: 0 auto 15px; position: relative; display: flex; justify-content: center; align-items: center; }
        .logo-wrapper::before { content: ''; position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle, rgba(0,240,255,0.4) 0%, transparent 70%); animation: pulse-ring 3s ease-out infinite; }
        @keyframes pulse-ring { 0% { transform: scale(0.8); opacity: 1; } 100% { transform: scale(1.5); opacity: 0; } }
        .logo-svg { width: 60px; height: 60px; z-index: 1; filter: drop-shadow(0 0 15px rgba(0,240,255,0.6)); animation: float 4s infinite; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
        h1 { font-size: 26px; font-weight: 900; letter-spacing: 2px; background: linear-gradient(90deg, #00f0ff, #9d4edf, #00f0ff); background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: gradient-shift 3s linear infinite; margin-bottom: 6px; }
        @keyframes gradient-shift { to { background-position: 200% center; } }
        .subtitle { font-size: 12px; color: var(--text-sub); letter-spacing: 3px; }

        .glass-card { background: var(--glass-bg); backdrop-filter: blur(20px); border: 1px solid var(--glass-border); border-radius: 20px; padding: 20px; margin-bottom: 16px; box-shadow: 0 8px 32px rgba(0,0,0,0.5); }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .card-title { font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
        .card-title svg { width: 18px; height: 18px; fill: var(--neon-blue); }
        .status-text { font-size: 12px; color: var(--text-sub); display: flex; align-items: center; gap: 6px; font-family: monospace; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--neon-red); box-shadow: 0 0 10px var(--neon-red); transition: 0.3s; }
        .status-dot.active { background: var(--neon-green); box-shadow: 0 0 10px var(--neon-green); }
        .card-desc { font-size: 13px; color: var(--text-sub); line-height: 1.5; margin-bottom: 16px; }

        .btn-group { display: flex; gap: 10px; }
        .btn { flex: 1; padding: 12px; border-radius: 12px; border: none; font-size: 14px; font-weight: 600; cursor: pointer; transition: 0.2s; display: flex; justify-content: center; align-items: center; gap: 6px; }
        .btn-primary { background: linear-gradient(135deg, #00f0ff, #0077ff); color: #000; box-shadow: 0 4px 15px rgba(0,240,255,0.2); }
        .btn-primary:active { transform: translateY(2px); }
        .btn-secondary { background: rgba(255,255,255,0.05); color: #fff; border: 1px solid rgba(255,255,255,0.1); }
        .btn-secondary:active { background: rgba(255,255,255,0.1); }

        .terminal-window { background: #000; border-radius: 14px; overflow: hidden; border: 1px solid #1a1a1a; margin-top: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); display: flex; flex-direction: column; height: 250px; }
        .terminal-header { background: #111; padding: 8px 12px; display: flex; gap: 6px; border-bottom: 1px solid #222; }
        .mac-btn { width: 10px; height: 10px; border-radius: 50%; }
        .mac-close { background: #ff5f56; } .mac-min { background: #ffbd2e; } .mac-max { background: #27c93f; }
        .terminal-body { padding: 12px; font-family: monospace; font-size: 12px; color: var(--neon-green); flex: 1; overflow-y: auto; line-height: 1.6; white-space: pre-wrap; word-break: break-all; }
        .terminal-input-area { display: flex; align-items: center; background: #111; border-top: 1px solid #222; padding: 10px 12px; font-family: monospace; font-size: 13px; }
        .terminal-prompt { color: var(--neon-blue); margin-right: 8px; font-weight: bold; }
        .terminal-input { flex: 1; background: transparent; border: none; color: #fff; outline: none; font-family: inherit; font-size: inherit; }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="header">
            <div class="logo-wrapper">
                <svg class="logo-svg" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2L3 5V11C3 16.55 6.84 21.74 12 23C17.16 21.74 21 16.55 21 11V5L12 2Z" fill="rgba(0,240,255,0.1)" stroke="#00f0ff" stroke-width="1.5"/>
                    <path d="M12 6V18M6 12H18" stroke="#9d4edf" stroke-width="2" stroke-linecap="round"/>
                    <circle cx="12" cy="12" r="3" fill="#00f0ff"/>
                </svg>
            </div>
            <h1>HuiJuiSU NEXT</h1>
            <div class="subtitle">Ultimate Hide Shield</div>
        </div>

        <div class="glass-card">
            <div class="card-header">
                <div class="card-title">
                    <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/></svg>
                    TEE 硬件伪装
                </div>
                <div class="status-text"><span class="status-dot" id="dot-tee"></span><span id="text-tee">检测中...</span></div>
            </div>
            <div class="card-desc">伪造 Bootloader 锁定状态与 Keybox 证书链。</div>
            <div class="btn-group">
                <button class="btn btn-primary" onclick="checkTEE()">检测状态</button>
                <button class="btn btn-secondary" onclick="execCmd('spoof')">强制伪装</button>
            </div>
        </div>

        <div class="glass-card">
            <div class="card-header">
                <div class="card-title">
                    <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
                    SUSFS 内核隐藏
                </div>
                <div class="status-text"><span class="status-dot" id="dot-susfs"></span><span id="text-susfs">未挂载</span></div>
            </div>
            <div class="card-desc">隐藏底层模块挂载点、循环设备与 AVC 日志。</div>
            <div class="btn-group">
                <button class="btn btn-primary" onclick="execCmd('susfs')">开启隐藏</button>
            </div>
        </div>

        <!-- 终端监控面板 (带输入框) -->
        <div class="terminal-window">
            <div class="terminal-header">
                <div class="mac-btn mac-close"></div><div class="mac-btn mac-min"></div><div class="mac-btn mac-max"></div>
            </div>
            <div class="terminal-body" id="log">[SYSTEM] Terminal initialized.
</div>
            <div class="terminal-input-area">
                <span class="terminal-prompt">root@HuiJuiSU:~#</span>
                <input type="text" id="cmd-input" class="terminal-input" placeholder="输入命令并回车..." autocomplete="off" spellcheck="false" onkeydown="handleKey(event)">
            </div>
        </div>
    </div>

    <script>
        const logEl = document.getElementById('log');
        const inputEl = document.getElementById('cmd-input');

        function printLog(msg, color = "#00ff66") {
            const time = new Date().toLocaleTimeString('en-US', { hour12: false });
            logEl.innerHTML += `\n<span style="color:${color}">[${time}] ${msg}</span>`;
            logEl.scrollTop = logEl.scrollHeight;
        }

        // 处理终端输入
        async function handleKey(e) {
            if (e.key === 'Enter') {
                const cmd = inputEl.value.trim();
                if (!cmd) return;
                
                inputEl.value = '';
                printLog(`root@HuiJuiSU:~# ${cmd}`, "#fff");
                
                try {
                    if (typeof ksu !== 'undefined') {
                        const res = await ksu.exec(cmd);
                        if (res.stdout) printLog(res.stdout.trim(), "#00ff66");
                        if (res.stderr) printLog(res.stderr.trim(), "#ff003c");
                    } else {
                        // 浏览器预览
                        setTimeout(() => {
                            printLog(`✔ [Preview] Command '${cmd}' executed.`, "#00ff66");
                        }, 300);
                    }
                } catch (err) {
                    printLog(`Fatal Error: ${err}`, "#ff003c");
                }
            }
        }

        async function execCmd(action) {
            let cmd = "";
            if (action === 'susfs') cmd = "ksu_susfs enable_hide_loops";
            if (action === 'spoof') cmd = "getprop ro.boot.flash.locked";
            if(!cmd) return;
            
            printLog(`Executing: ${cmd}`, "#00f0ff");
            try {
                if (typeof ksu !== 'undefined') {
                    const res = await ksu.exec(cmd);
                    if (res.errno === 0) {
                        printLog(`✔ Success.`, "#00ff66");
                        if(action === 'susfs') updateDot('susfs', true, '已启用');
                    } else printLog(`✘ Failed.`, "#ff003c");
                } else {
                    setTimeout(() => {
                        printLog(`✔ [Preview] Success.`, "#00ff66");
                        if(action === 'susfs') updateDot('susfs', true, '已启用');
                    }, 500);
                }
            } catch (e) { printLog("✘ IPC Error.", "#ff003c"); }
        }

        async function checkTEE() {
            printLog("Reading TEE property...", "#00f0ff");
            try {
                if (typeof ksu !== 'undefined') {
                    const res = await ksu.exec("getprop ro.boot.flash.locked");
                    const locked = res.stdout.trim() === "1";
                    updateDot('tee', locked, locked ? '已锁定' : '未锁定');
                    printLog(`BL Locked: ${locked}`, locked ? "#00ff66" : "#ff003c");
                } else {
                    setTimeout(() => {
                        updateDot('tee', true, '已伪装');
                        printLog("✔ [Preview] TEE Locked.", "#00ff66");
                    }, 500);
                }
            } catch (e) { printLog("✘ Read failed.", "#ff003c"); }
        }

        function updateDot(id, isActive, text) {
            const dot = document.getElementById(`dot-${id}`);
            const textEl = document.getElementById(`text-${id}`);
            if(isActive) dot.classList.add('active'); else dot.classList.remove('active');
            textEl.innerText = text;
        }

        window.onload = () => setTimeout(checkTEE, 800);
    </script>
</body>
</html>
